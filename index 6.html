<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Видео">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Видео</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
video{position:fixed;left:50%;bottom:0;transform:translateX(-50%);
height:calc(100dvh - env(safe-area-inset-top,0px) - 18vh);width:auto;aspect-ratio:393/852;max-width:100vw;
object-fit:cover;background:#000;pointer-events:none}
</style></head><body>
<video id="v" src="video.mp4" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
<script>
var v=document.getElementById('v');
v.muted=true;
function go(){if(v.paused){var r=v.play();if(r&&r.catch)r.catch(function(){})}}
['touchstart','click'].forEach(function(e){document.addEventListener(e,go,{passive:true})});
document.addEventListener('visibilitychange',function(){if(!document.hidden)go()});
window.addEventListener('pageshow',go);
v.addEventListener('pause',function(){setTimeout(go,200)});
v.addEventListener('canplay',go);
setInterval(go,2000);
go();
</script>
</body></html>
